{{- if .Values.httpRoute.enabled }}
{{- $fullname := include "botmother-app.fullname" . -}}
{{- range $idx, $route := .Values.httpRoute.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}{{ if gt (len $.Values.httpRoute.routes) 1 }}-{{ $idx }}{{ end }}
  labels:
    {{- include "botmother-app.labels" $ | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (default $.Values.httpRoute.parentRefs $route.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (default $.Values.httpRoute.hostnames $route.hostnames) | nindent 4 }}
  rules:
    {{- toYaml $route.rules | nindent 4 }}
{{- end }}
{{- end }}
