{{- if .Values.service.enabled }}
{{- $fullname := include "botmother-app.fullname" . -}}
{{- $port := include "botmother-app.servicePort" . -}}
{{- $targetPort := include "botmother-app.targetPort" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "botmother-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  {{- if eq (.Values.service.type | default "ClusterIP") "ClusterIP" }}
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  {{- end }}
  ports:
    - port: {{ $port }}
      targetPort: {{ $targetPort }}
      protocol: TCP
      name: http
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "botmother-app.selectorLabels" . | nindent 4 }}
{{- end }}
