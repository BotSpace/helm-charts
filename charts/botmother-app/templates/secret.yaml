{{- $fullname := include "botmother-app.fullname" . -}}
{{- range $name, $sec := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-{{ $name }}
  labels:
    {{- include "botmother-app.labels" $ | nindent 4 }}
type: {{ $sec.type | default "Opaque" }}
{{- if $sec.stringData }}
stringData:
  {{- range $key, $value := $sec.stringData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if $sec.data }}
data:
  {{- range $key, $value := $sec.data }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}
{{- end }}
