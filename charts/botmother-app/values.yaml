replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}
  rules: []

podAnnotations: {}

podLabels: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

command: []
args: []

initContainers: []

env: []

envFrom: []

configMaps: {}

secrets: {}

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: ""
  nodePort: ""

httpRoute:
  enabled: false
  parentRefs:
    - name: main-gateway
      namespace: default
  hostnames: []
  rules: []

probes:
  startup:
    enabled: true
    type: tcpSocket
    httpGet:
      path: /health
      port: ""
    tcpSocket:
      port: ""
    exec:
      command: []
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  readiness:
    enabled: true
    type: tcpSocket
    httpGet:
      path: /health
      port: ""
    tcpSocket:
      port: ""
    exec:
      command: []
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    type: tcpSocket
    httpGet:
      path: /health
      port: ""
    tcpSocket:
      port: ""
    exec:
      command: []
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

volumes: []

volumeMounts: []

persistentVolumeClaims: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

dnsConfig: {}

terminationGracePeriodSeconds: 30

# Graceful shutdown. Even with maxUnavailable:0/maxSurge:1, a terminating pod is
# removed from the gateway upstream asynchronously — for a brief window the
# gateway may still route to it, causing 502s during a rolling deploy. A preStop
# sleep keeps the old pod serving while it is de-registered, so traffic drains
# cleanly. Set to 0 to disable (e.g. images without /bin/sh).
# Must stay below terminationGracePeriodSeconds.
preStopSleepSeconds: 10

# Full container lifecycle override; when set it takes precedence over
# preStopSleepSeconds (e.g. for a custom preStop or postStart hook).
lifecycle: {}

prometheus:
  scrape: false
  port: ""

workloadType: Deployment
# DaemonSet also supported
