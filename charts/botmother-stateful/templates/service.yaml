{{- if .Values.service.enabled }}
{{- $fullname := include "botmother-stateful.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "botmother-stateful.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  {{- if eq .Values.service.clusterIP "None" }}
  clusterIP: None
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: tcp
  selector:
    {{- include "botmother-stateful.selectorLabels" . | nindent 4 }}
{{- end }}
