{{- $fullname := include "botmother-stateful.fullname" . -}}
{{- range $name, $sec := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-{{ $name }}
  labels:
    {{- include "botmother-stateful.labels" $ | nindent 4 }}
type: Opaque
{{- if $sec.stringData }}
stringData:
  {{- range $key, $value := $sec.stringData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
